name: full

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: jobs-postgres
    command: ["postgres", "-c", "max_connections=250"]
    environment:
      POSTGRES_USER: jobsuser
      POSTGRES_PASSWORD: jobspass
      POSTGRES_DB: jobsdb
    #   # PostgreSQL performance tuning for high write throughput
    #   POSTGRES_INITDB_ARGS: "-c synchronous_commit=off"
    # command:
    #   - "postgres"
    #   - "-c"
    #   - "synchronous_commit=off"
    #   - "-c"
    #   - "fsync=off"
    #   - "-c"
    #   - "full_page_writes=off"
    #   - "-c"
    #   - "wal_level=minimal"
    #   - "-c"
    #   - "max_wal_senders=0"
    #   - "-c"
    #   - "checkpoint_timeout=30min"
    #   - "-c"
    #   - "max_wal_size=2GB"
    #   - "-c"
    #   - "shared_buffers=256MB"
    #   - "-c"
    #   - "work_mem=16MB"
    # No external port exposure - only accessible within Docker network
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobsuser -d jobsdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobs-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: jobs-redis
    # No external port exposure - only accessible within Docker network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobs-network

  # API Server
  api:
    build:
      context: ./codebase
      dockerfile: Dockerfile
    container_name: jobs-api
    command: ["node", "dist/apps/api/main.js"]
    ports:
      - "3020:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://jobsuser:jobspass@postgres:5432/jobsdb
      REDIS_URL: redis://redis:6379
      API_PORT: 3000
      DB_POOL_MAX: 50
      DB_POOL_MIN: 10
      HF_MODE: "true"
      USE_RAW_SQL: "true"
      TYPEORM_SYNCHRONIZE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobs-network
    restart: unless-stopped

  # Monitor Service
  monitor:
    build:
      context: ./codebase
      dockerfile: Dockerfile
    container_name: jobs-monitor
    command: ["node", "dist/apps/monitor/main.js"]
    ports:
      - "3022:3002"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://jobsuser:jobspass@postgres:5432/jobsdb
      REDIS_URL: redis://redis:6379
      MONITOR_PORT: 3002
      MONITOR_CRON_SCHEDULE: "*/2 * * * *"
      MAX_QUEUE_WAIT_MINUTES: 30
      JOB_TTL_DAYS_COMPLETED: 7
      JOB_TTL_DAYS_FAILED: 30
      JOB_TTL_DAYS_CANCELLED: 7
      JOB_TIMEOUT_MINUTES: 5
      MONITOR_WORKER_STATS_QUERY_PERIOD_SECONDS: 10
      HF_MODE: "true"
      DB_POOL_MAX: 3
      DB_POOL_MIN: 1
      TYPEORM_SYNCHRONIZE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobs-network
    restart: unless-stopped

  # Worker 1
  worker-1:
    build:
      context: ./codebase
      dockerfile: Dockerfile
    container_name: jobs-worker-1
    command: ["node", "dist/apps/worker/main.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://jobsuser:jobspass@postgres:5432/jobsdb
      REDIS_URL: redis://redis:6379
      WORKER_ID: worker-1
      WORKER_CONCURRENCY: 50
      WORKER_STATS_PORT: 3001
      WORKER_STATS_REPORTING_PERIOD_SECONDS: 5
      WORKER_STATS_REDIS_TTL_SECONDS: 300
      MAX_RETRY_ATTEMPTS: 3
      EXPONENTIAL_BACKOFF_BASE: 2
      JOB_TIMEOUT_MINUTES: 5
      HF_MODE: "true"
      DB_POOL_MAX: 20
      DB_POOL_MIN: 5
      TYPEORM_SYNCHRONIZE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobs-network
    restart: unless-stopped

  # Worker 2
